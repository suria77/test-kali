<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test de Kali · Liberación, Transformación y Poder Interior</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --paper:#F6F0E3; --paper2:#E9DBC0; --ink:#211823; --ink2:#5A4E58;
  --maroon:#5C0E17; --maroon2:#7A1420; --sindoor:#7A1420; --saffron:#8C6A2E;
  --gold:#9C7A2E; --gold2:#C9A94A; --ocean:#3A0A10; --line:#DCCDA9;
  --disp:'Cinzel', 'Trajan Pro', Georgia, serif;
  --body:'EB Garamond', Garamond, 'Times New Roman', Georgia, serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:20px;line-height:1.6;
  background-image:radial-gradient(1200px 520px at 50% -120px,#E9DBC0 0%,rgba(233,219,192,0) 70%);background-repeat:no-repeat;min-height:100vh}
img{max-width:100%;display:block}
button{font-family:inherit}
.wrap{max-width:680px;margin:0 auto;padding:18px 18px 60px}

.phases{display:flex;align-items:center;justify-content:center;gap:0;margin:8px auto 30px;max-width:420px}
.phases .pip{width:17px;height:17px;border-radius:50%;border:2px solid #4A2A20;background:radial-gradient(circle at 35% 35%,#EFE2C8,#DCC8A0);flex:none}
.phases .pip.on{background:radial-gradient(circle at 35% 35%,#8C1720,#3A0A10);border-color:#1B0509}
.phases .pip.cur{background:radial-gradient(circle at 35% 35%,#B0555F,#7A1420);border-color:#1B0509;box-shadow:0 0 0 4px rgba(122,20,32,.25)}
.phases .bar{flex:1;height:3px;background:var(--line)}
.phases .bar.on{background:var(--sindoor)}
.phase-name{text-align:center;font-family:var(--disp);font-size:15px;letter-spacing:.06em;color:var(--maroon);margin:8px 0 2px}

.sheet{position:relative;background:#FFFCF5;border:1.5px solid var(--gold);border-radius:6px;padding:26px 22px 24px;margin-top:14px;
  box-shadow:0 0 0 5px #FFFCF5,0 0 0 6.5px var(--line),0 14px 30px -18px rgba(58,10,16,.4)}
.sheet::before,.sheet::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--gold);transform:rotate(45deg);background:#FFFCF5}
.sheet::before{top:-11px;left:calc(50% - 9px)}
.sheet::after{bottom:-11px;left:calc(50% - 9px)}
.ribbon{display:block;margin:-40px auto 18px;width:fit-content;max-width:100%;background:linear-gradient(#3A0A10,#1B0509);color:#E9C77A;
  font-family:var(--disp);font-weight:600;font-size:16px;letter-spacing:.05em;padding:8px 26px;border:1.5px solid var(--gold2);
  clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%);text-align:center}
h1,h2,h3{font-family:var(--disp);color:var(--maroon);font-weight:600;line-height:1.2;margin:0}
h2{font-size:27px;text-align:center;margin-bottom:10px}
h3{font-size:22px;text-align:center;margin-bottom:12px}
.lead{text-align:center;color:var(--ink2);font-size:19.5px;margin:6px auto 18px;max-width:34em}
.q{font-weight:600;font-size:21px;color:var(--ink);margin:18px 0 6px;line-height:1.35}
.help{color:var(--ink2);font-style:italic;font-size:18px;margin:0 0 10px}
textarea,input[type=text]{width:100%;font-family:var(--body);font-size:20px;color:var(--ink);background:#F6F0E3;border:1.5px solid var(--line);
  border-radius:6px;padding:12px 14px;line-height:1.45}
textarea{min-height:110px;resize:vertical}
textarea:focus,input:focus{outline:3px solid rgba(122,20,32,.3);border-color:var(--sindoor)}
.opts{display:grid;gap:10px;margin-top:8px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:#F6F0E3;border:1.5px solid var(--line);border-radius:6px;
  padding:13px 14px;font-size:19.5px;color:var(--ink);cursor:pointer;line-height:1.4}
.opt:hover{border-color:var(--gold)}
.opt:focus-visible{outline:3px solid rgba(122,20,32,.45);outline-offset:2px}
.opt .box{flex:none;width:24px;height:24px;margin-top:3px;border:2px solid var(--gold);border-radius:4px;background:#fff;display:grid;place-items:center}
.opt.round .box{transform:rotate(45deg);border-radius:3px;width:20px;height:20px;margin:5px 2px 0}
.opt .box svg{opacity:0}
.opt.sel{background:#ECD8D5;border-color:var(--sindoor);box-shadow:inset 4px 0 0 var(--sindoor)}
.opt.sel .box{background:var(--sindoor);border-color:var(--ocean)}
.opt.sel .box svg{opacity:1}
.opt.round.sel .box svg{transform:rotate(-45deg)}
.opt b{display:block;color:var(--maroon);font-weight:700}
.opt small{display:block;font-size:17.5px;color:var(--ink2)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px}
.btn{appearance:none;border:0;border-radius:40px;padding:14px 28px;font-size:20px;font-weight:600;cursor:pointer;font-family:var(--body)}
.btn.main{background:linear-gradient(#8C1720,#3A0A10);color:#fff;box-shadow:0 6px 16px -8px rgba(58,10,16,.85);border:1.5px solid #1B0509}
.btn.main:hover{filter:brightness(1.1)}
.btn.ghost{background:#F6F0E3;color:var(--maroon);border:1.5px solid var(--gold)}
.btn:focus-visible{outline:3px solid rgba(58,10,16,.5);outline-offset:3px}
.back{background:none;border:0;color:var(--ink2);font-size:18.5px;cursor:pointer;text-decoration:underline;text-underline-offset:4px;padding:8px}
.err{color:#A3240C;font-size:18px;text-align:center;margin-top:12px;min-height:1em}
.art{margin:0 auto 6px}
.art.hero{max-width:280px;margin-top:-6px;border-radius:8px;overflow:hidden}
.art.mid{max-width:260px;border-radius:8px;overflow:hidden}
.art.small{max-width:150px}
.caption{text-align:center;font-style:italic;color:var(--ink2);font-size:17px;margin:4px 0 10px}

.cover{text-align:center;padding-top:10px}
.cover h1{font-size:36px;letter-spacing:.02em;color:var(--maroon);text-shadow:0 1px 0 #fff}
.cover .sub{font-family:var(--disp);font-size:20px;color:var(--gold);letter-spacing:.04em;margin:8px 0 16px}
.cover blockquote{margin:0 auto 20px;max-width:30em;font-style:italic;font-size:21px;color:var(--ink2)}
.journey{display:grid;gap:10px;text-align:left;margin:20px 0 6px}
.journey div{display:flex;gap:14px;align-items:baseline;border-top:1px solid var(--line);padding-top:10px}
.journey .n{font-family:var(--disp);color:var(--sindoor);font-weight:700;min-width:30px;font-size:20px}
.journey b{color:var(--maroon)}

.shadow-head{text-align:center;margin-bottom:6px}
.shadow-head .count{font-family:var(--disp);color:var(--gold);font-size:16px}
.shadow-head h2{font-size:32px;margin:4px 0 2px}
.shadow-head .sub{font-style:italic;font-size:20px;color:var(--ink2)}
.shadow-desc{background:#EFE1D2;border-left:4px solid var(--maroon2);padding:10px 14px;margin:12px 0 4px;font-size:19px}

.r-hero{text-align:center;padding-top:6px}
.r-hero .ring{width:210px;height:210px;margin:0 auto;border-radius:50%;padding:6px;background:conic-gradient(from 0deg,#C9A94A,#7A1420,#C9A94A,#3A0A10,#C9A94A);
  box-shadow:0 12px 30px -12px rgba(58,10,16,.65)}
.r-hero .ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 30%;background:#EFE1D2}
.r-hero .k{font-size:19px;color:var(--ink2);margin:16px 0 0;font-style:italic}
.r-hero .name{font-family:var(--disp);font-size:34px;color:var(--maroon);font-weight:700;margin:2px 0}
.r-hero .asp{font-size:19px;color:var(--gold)}
.reading p{margin:0 0 16px;font-size:20.5px}
.reading p:first-child::first-letter{font-family:var(--disp);float:left;font-size:58px;line-height:.9;padding:6px 8px 0 0;color:var(--sindoor)}
.myth{background:linear-gradient(#F2E6D2,#E9DBC0);border:1px solid var(--line);border-radius:6px;padding:16px 18px;font-style:italic;font-size:19.5px;margin:10px 0 12px}
.note{border:1.5px dashed var(--maroon2);border-radius:6px;padding:12px 14px;font-size:18.5px;background:#F6F0E3;margin-top:10px}
.photo{width:100%;max-width:420px;margin:4px auto 14px;border-radius:10px;border:2px solid var(--gold2);box-shadow:0 12px 26px -14px rgba(33,24,35,.6)}
.logo{max-width:220px;margin:30px auto 0}
.label-small{text-align:center;color:var(--ink2);font-style:italic;font-size:18px;margin:-6px 0 10px}
.tend{display:grid;gap:10px}
.t-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:19.5px}
.t-row.dom{font-weight:700;color:var(--maroon)}
.pips{display:flex;gap:8px}
.pips i{width:15px;height:15px;border-radius:50%;border:2px solid #4A2A20;display:block;background:#EFE2C8}
.pips i.on{background:radial-gradient(circle at 35% 35%,#8C1720,#3A0A10);border-color:#1B0509}
dl.card{margin:0}
dl.card dt{font-family:var(--disp);font-size:15px;color:var(--gold);margin-top:12px;letter-spacing:.03em}
dl.card dd{margin:2px 0 0;font-size:20px}
ol.steps{padding-left:26px;margin:0}
ol.steps li{margin-bottom:10px;padding-left:4px}
ol.steps li::marker{color:var(--sindoor);font-family:var(--disp);font-weight:700}
ul.checks{padding-left:0;list-style:none;margin:0}
ul.checks li{padding:8px 0 8px 30px;position:relative;border-bottom:1px solid var(--line)}
ul.checks li::before{content:"";position:absolute;left:4px;top:15px;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8C1720,#3A0A10)}
.decree{text-align:center;background:linear-gradient(#3A0A10,#1B0509);color:#F0E6D2;border-radius:6px;padding:26px 22px;margin-top:22px;border:2px solid var(--gold2)}
.decree p{margin:0}
.decree .q2{font-size:24px;font-style:italic;line-height:1.45}
.decree .cap{font-family:var(--disp);font-size:14px;color:var(--gold2);margin-top:10px;letter-spacing:.05em}
.decree .jai{font-family:var(--disp);font-size:26px;color:#E9C77A;margin-top:18px}
.actions{display:grid;gap:12px;margin-top:24px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.brand{display:block;text-align:center;margin-top:26px;color:var(--ink2);font-size:17px;text-decoration:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ocean);color:#fff;
  padding:12px 20px;border-radius:30px;font-size:17px;box-shadow:0 8px 20px -8px rgba(0,0,0,.4);z-index:10;max-width:90vw;text-align:center}
.reveal{animation:rise .9s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}}
@media (max-width:480px){body{font-size:19px}.sheet{padding:24px 16px 22px}.cover h1{font-size:29px}h2{font-size:24px}.row2{grid-template-columns:1fr}.r-hero .name{font-size:28px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ═════════════ CONTENIDO: MOTOR DE LECTURA DE KALI ═════════════ */

const AREAS = [
  { key: "habitos", t: "Destrucción de hábitos o adicciones persistentes", v: "daruka",
    f: ["Un hábito no cede a más fuerza de voluntad del mismo tipo: cede a un cambio de naturaleza, como el veneno que se volvió Kali.", "Lo que se repite sin conciencia tiene fuerza. Lo que decides interrumpir, también."] },
  { key: "miedos", t: "Liberación de miedos profundos y apegos emocionales", v: "mahakala",
    f: ["El miedo más profundo casi siempre tiene que ver con perder algo que crees que eres, no algo que simplemente tienes.", "Kali no promete que nada cambie: promete que hay algo en ti que el cambio no puede tocar."] },
  { key: "dialogo", t: "Superación del diálogo interno negativo y las dudas", v: "raktabija",
    f: ["Una duda que se combate de frente casi siempre vuelve multiplicada. Kali no discute con la mente: cambia el terreno donde esa mente actúa.", "El diálogo interno negativo se alimenta de la atención que le das, no de su verdad."] },
  { key: "relaciones", t: "Fuerza para cortar relaciones o situaciones tóxicas", v: "shumbhanishumbha",
    f: ["Cortar no siempre es violencia: a veces es la única forma de que algo deje de sangrar.", "Lo que de verdad te pertenece no se pierde por soltar lo que ya no lo es."] },
  { key: "espiritual", t: "Despertar de la conciencia espiritual y la verdad sin velos", v: null,
    f: ["Despertar no es acumular más creencias: es quitar, uno a uno, los velos que ya no necesitas.", "La verdad sin velos rara vez es cómoda al principio. Kali no promete comodidad: promete claridad."] },
  { key: "proteccion", t: "Protección ante energías negativas e influencias externas", v: "chandamunda",
    f: ["La protección real no siempre es un muro: a veces es la claridad de saber quién eres, que no necesita defenderse con rabia.", "Lo que te amenaza desde fuera rara vez tiene tanto poder como el que le prestas reaccionando sin medir."] },
  { key: "otro", t: "Otro", v: null,
    f: ["Lo que no tiene nombre también se puede enfrentar.", "A veces la sombra más importante es la que todavía no sabemos nombrar."] }
];

const ASURA_ORDER = ["raktabija", "chandamunda", "shumbhanishumbha", "daruka", "mahakala"];

const ASURAS = {
  raktabija: {
    name: "Raktabija", sub: "Los Deseos Multiplicados y el Bucle del Ego", sym: "cuenco",
    desc: "El asura cuya sangre, al tocar el suelo, engendraba un clon idéntico a él por cada gota derramada. Representa el deseo o el pensamiento obsesivo que, cada vez que se combate de frente, se multiplica en vez de desaparecer.",
    st: ["Cada vez que intento acallar un pensamiento o deseo obsesivo, parece multiplicarse por diez.", "Me cuesta encontrar satisfacción en lo que tengo porque la mente siempre pide más."],
    mito: "Cuando la sangre de Raktabija tocaba el suelo, cada gota se convertía en un clon suyo, idéntico en fuerza. El campo de batalla se llenó en instantes de miles de Raktabijas. Fue entonces cuando, del ceño fruncido de Durga, surgió Kali: oscura, de lengua inmensa, que se lanzó a beber cada gota de sangre antes de que tocara la tierra, mientras los dioses herían al asura original. Ninguna gota volvió a multiplicarse, y Raktabija cayó.",
    ense: "Kali no combatió a Raktabija golpe a golpe: cambió el terreno donde su sangre caía. Lo que se multiplica en ti, un pensamiento, un deseo, una necesidad, no se vence resistiéndolo de frente: se vence no dejando que toque el suelo, que se repita sin conciencia.",
    open: ["El asura que más pesa hoy en ti es Raktabija: el deseo que, en vez de saciarse, se multiplica.", "Tu test señala a Raktabija. Cada vez que cumples un deseo, aparecen diez más antes de que puedas disfrutarlo.", "Lo que más te cubre hoy es la sed que nunca toca fondo: Raktabija, que se multiplicaba con cada gota derramada."],
    mir: [["Intentas acallar un pensamiento o deseo obsesivo y parece multiplicarse por diez. Es exactamente el mecanismo de Raktabija: combatirlo de frente solo siembra el terreno para el siguiente.", "Marcaste la multiplicación del pensamiento. Kali no luchó gota a gota: cambió el suelo donde caían. Tu combate tampoco es contra cada pensamiento, sino contra el terreno que los deja crecer."],
           ["Te cuesta encontrar satisfacción en lo que ya tienes porque la mente siempre pide más. Mientras la sangre siga tocando el suelo, siempre habrá un Raktabija más.", "Marcaste la falta de satisfacción. Antes de perseguir el siguiente deseo, vale la pena preguntarse si nace de una falta real o del simple hábito de desear."]],
    daily: ["Antes de perseguir el próximo deseo, nombra tres cosas que ya tienes y que ese deseo pasaría por alto.", "Cuando un pensamiento obsesivo vuelva por décima vez, no lo combatas: obsérvalo como Kali observa, sin identificarte, y déjalo pasar sin darle más terreno."],
    afirm: "Lo que ya soy también es suficiente.",
    destruye: "la multiplicación del deseo que nunca se sacia"
  },
  chandamunda: {
    name: "Chanda y Munda", sub: "La Ira e Impulsividad Ciega", sym: "espada",
    desc: "Los dos generales de Shumbha, enviados a capturar a Durga apenas vieron su belleza, cegados por el impulso de poseerla. Representan la reacción que actúa antes de pensar: la ira o la agresividad que se lanza sin medir consecuencias.",
    st: ["Reacciono con enojo o agresividad cuando me siento amenazado/a o contradicho/a.", "Dejo que la frustración controle mis decisiones en momentos de tensión."],
    mito: "Al ver la belleza de Durga en el Himalaya, Shumbha envió a sus generales Chanda y Munda, al frente de un enorme ejército, para capturarla. Del rostro furioso de la diosa surgió Kali, oscura como la tinta, que se lanzó contra el ejército devorándolo. Cuando Chanda y Munda avanzaron contra ella, Kali los decapitó de un solo movimiento y llevó sus cabezas a Durga, que desde entonces la llamó Chamunda.",
    ense: "Chanda y Munda gastaron toda su fuerza en el primer impulso, sin medir a quién tenían delante, y cayeron por ello. Kali no evitó la furia: la usó con precisión, en el instante exacto. La diferencia entre su ira y la de ellos no es la intensidad: es que la suya tenía una dirección.",
    open: ["El asura que más pesa hoy en ti es la pareja de Chanda y Munda: el impulso que actúa antes de pensar.", "Tu test señala a Chanda y Munda. No es que tu furia esté equivocada: es que sale antes de que puedas elegir qué hacer con ella.", "Lo que más te cubre hoy es la reacción ciega, la misma que llevó a Chanda y Munda a atacar sin medir a quién tenían delante."],
    mir: [["Reaccionas con enojo o agresividad cuando te sientes amenazado o contradicho. Chanda y Munda avanzaron sin dudar en cuanto vieron a Durga: gastaron toda su fuerza en el primer paso.", "Marcaste la reacción de enojo. Entre lo que te amenaza y lo que respondes hay un instante que, de momento, se te está escapando."],
           ["Dejas que la frustración controle tus decisiones en momentos de tensión. Kali no dudó frente a Chanda y Munda, pero su furia tenía una dirección clara: la tuya, ¿la tiene?", "Marcaste que la frustración decide por ti. No se trata de no sentirla: se trata de que decidas tú qué hacer con ella, no al revés."]],
    daily: ["Cuando sientas la primera oleada de rabia, respira tres veces antes de decir la primera palabra.", "Antes de reaccionar a una provocación, pregúntate: «¿esta reacción es mía, o es solo el primer impulso hablando?»"],
    afirm: "Mi fuerza tiene dirección, no solo intensidad.",
    destruye: "la reacción que actúa antes de que decidas tú"
  },
  shumbhanishumbha: {
    name: "Shumbha y Nishumbha", sub: "El Orgullo y el Sentido de Posesión", sym: "cabeza",
    desc: "Los dos hermanos asuras que habían conquistado el cielo y que exigieron poseer a Durga, primero como esposa, luego como trofeo de guerra. Representan el orgullo que confunde el control con la fuerza, y el miedo a perder lo que se considera propio.",
    st: ["Me aferro tercamente a mi razón o a la necesidad de controlar los resultados.", "Siento miedo a perder mi estatus, imagen o lo que considero \u201cmío\u201d."],
    mito: "Shumbha, rey de los asuras, exigió a Durga como esposa, seguro de su poder. En la batalla final la acusó de esconderse detrás de Kali y las diosas madre, de no ser fuerte por sí sola. Durga las reabsorbió a todas en sí misma y respondió: «Ekaivaham jagatyatra», yo soy la única en este mundo. Kali, una de esas formas, había estado devorando ejércitos enteros durante toda la batalla, sin necesitar reconocimiento ni conservar nada para sí.",
    ense: "Shumbha no podía concebir un poder que no necesitara poseer algo para ser real. Kali destruye precisamente esa idea: su fuerza no depende de lo que retiene, guarda o controla. Lo que de verdad es tuyo no se pierde por soltarlo.",
    open: ["El asura que más pesa hoy en ti es la pareja de Shumbha y Nishumbha: el orgullo que confunde control con seguridad.", "Tu test señala a Shumbha y Nishumbha. Lo que te cubre no es tener, sino necesitar retener lo que tienes.", "Lo que más te cubre hoy tiene el nombre de Shumbha, el que exigió por la fuerza lo que nunca fue realmente suyo."],
    mir: [["Te aferras tercamente a tu razón o a la necesidad de controlar los resultados. Shumbha exigió a Durga como esposa sin que ella lo hubiera elegido: aferrarse no crea vínculo, solo pesa.", "Marcaste el aferrarte al control. Kali, en cambio, actuó sin necesitar retener nada para sí. Soltar el control no te vacía: solo te libera de sostener lo que nunca dependió de ti."],
           ["Sientes miedo a perder tu estatus, tu imagen o lo que consideras \u201ctuyo\u201d. Nishumbha quiso poseer un trono que nunca le perteneció de verdad: el miedo a perder algo prestado no protege, solo desgasta.", "Marcaste el miedo a perder lo que es \u201ctuyo\u201d. Durga, al final, venció sola, y Kali no necesitó guardar nada de lo que había devorado. Lo único que nadie puede quitarte es tu propia fuerza."]],
    daily: ["Nombra en voz baja algo a lo que te aferras, y pregúntate si lo sostienes por amor o por miedo a perderlo.", "Practica soltar algo pequeño y sin importancia hoy, solo para recordar que soltar no te destruye."],
    afirm: "Lo que de verdad es mío no se me puede quitar.",
    destruye: "el apego que confunde control con seguridad"
  },

/* ═════════════ UTILIDADES ═════════════ */
function norm(s) { return (s || "").toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }
function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; } return Math.abs(h); }
function pickV(arr, seed, salt) { return arr[hashStr(seed + "|" + salt) % arr.length]; }
function excerpt(s, n = 150) { s = (s || "").trim().replace(/\s+/g, " ").replace(/^[«"“]|[»"”]$/g, ""); if (s.length <= n) return s.replace(/[.\s]+$/, ""); return s.slice(0, n).replace(/\s+\S*$/, "") + "…"; }
function lcFirst(s) { return s ? s.charAt(0).toLowerCase() + s.slice(1) : s; }
function ucFirst(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function greet(name, text) { return name ? `${name}, ${lcFirst(text)}` : text; }

/* ═════════════ MOTOR ═════════════ */
function scoreA(st) {
  const s = {}; ASURA_ORDER.forEach(k => s[k] = (st.checks[k] || []).filter(Boolean).length);
  const areaObj = AREAS.find(x => x.key === st.area);
  const pref = (st.presente && ASURA_ORDER.includes(st.presente)) ? st.presente : (areaObj && areaObj.v);
  const order = ASURA_ORDER.slice().sort((a, b) => (s[b] - s[a]) || ((b === pref) - (a === pref)) || (ASURA_ORDER.indexOf(a) - ASURA_ORDER.indexOf(b)));
  const dom = s[order[0]] > 0 ? order[0] : null;
  const second = dom && s[order[1]] > 0 ? order[1] : null;
  const total = ASURA_ORDER.reduce((acc, k) => acc + s[k], 0);
  const vals = order.map(k => s[k]);
  let punto;
  if (total <= 2) punto = "reposo";
  else if (vals[1] >= 2) punto = "dosfrentes";
  else if (vals[0] >= 2 && vals[0] - vals[1] >= 2) punto = "directo";
  else punto = "formacion";
  return { s, dom, second, total, punto, order };
}

function symbolFor(st, sc) {
  if (sc.dom) return { key: ASURAS[sc.dom].sym, S: SIMBOLOS[ASURAS[sc.dom].sym] };
  const momMap = { veneno: "calavera", furia: "espada", danza: "cabeza", lengua: "cuenco", amavasya: "luna" };
  const key = momMap[st.momento] || "luna";
  return { key, S: SIMBOLOS[key] };
}

function tensions(st, sc) {
  const out = [], d = sc.dom, a = st.area, m = st.momento, p = st.presente;
  const chosen = COMMITMENTS.filter((c, i) => st.compromisos[i]).map(c => c.key);
  const add = (pr, t) => out.push({ pr, t });
  const txt = norm([st.atadura, st.liberacion, st.sankalpa, st.porque, st.miedo, st.apego].join(" "));

  if (p && p !== "nose" && d) {
    if (p === d) add(10, `Cuando te preguntamos qué asura sentías más presente, elegiste a ${ASURAS[p].name}, y tus respuestas dicen lo mismo. Esa coincidencia vale mucho: ya estás viendo con claridad a qué te enfrentas.`);
    else add(10, `Cuando te preguntamos qué asura sentías más presente, elegiste a ${ASURAS[p].name}. Pero tus respuestas señalan con más fuerza a ${ASURAS[d].name}. Merece atención: a veces el asura que más pesa es justamente el que menos vemos venir.`);
  }
  if (p === "nose" && d) add(9, `No sabías qué asura estaba más presente, y tus respuestas señalan a ${ASURAS[d].name}. No saberlo no es un fallo: es, de hecho, el punto exacto desde donde empieza cualquier diagnóstico.`);

  if (d === "raktabija" && a === "dialogo") add(9, "Quieres superar el diálogo interno negativo, y tu asura dominante es precisamente el deseo o pensamiento que se multiplica. Diagnóstico y deseo señalan al mismo lugar.");
  if (d === "chandamunda" && a === "proteccion") add(9, "Buscas protegerte de energías negativas, y el asura que más pesa es la reacción impulsiva. A veces la mejor protección no es reaccionar más fuerte, sino reaccionar con más precisión.");
  if (d === "shumbhanishumbha" && a === "relaciones") add(9, "Quieres fuerza para cortar relaciones tóxicas, y tu asura dominante es el apego que confunde control con seguridad. Cortar hacia fuera empieza, casi siempre, por soltar hacia dentro.");
  if (d === "daruka" && a === "habitos") add(9, "Quieres destruir un hábito persistente, y tu asura dominante es precisamente la inercia. Ya sabes, entonces, que no es un tema de más fuerza de voluntad, sino de cambiar de estrategia.");
  if (d === "mahakala" && a === "miedos") add(9, "Buscas liberarte de miedos profundos, y el asura que más pesa es el miedo al tiempo mismo. Es, en cierto modo, el miedo más antiguo de todos: y también el que Kali more directamente encarna.");
  if (sc.total >= 8) add(8, "Has marcado casi todas las afirmaciones. Cuidado con que esto se convierta en autoexigencia: reconocer a varios asuras a la vez no significa que debas vencerlos todos hoy.");
  if (!d) add(7, "No marcas ningún asura con fuerza. Puede ser un momento de calma real, o que el enemigo que hoy te ronda todavía no tenga nombre.");
  if (d && /(siempre|desde hace|hace anos|toda la vida|desde pequen|de siempre)/.test(txt)) add(7, "Hablas de algo que te acompaña desde hace mucho. Incluso Daruka, que se creía protegido para siempre, cayó: que algo lleve tiempo no significa que sea inamovible.");
  if (d && !chosen.includes(ASURA_COMMIT[d]) && chosen.length) { const c = COMMITMENTS.find(x => x.key === ASURA_COMMIT[d]); add(7, `Frente a ${ASURAS[d].name}, el compromiso que más te ayudaría es «${c.t.replace(/\.$/, "")}», porque ${c.why}. No lo has marcado; quizá sea, precisamente por eso, el que más te conviene sumar.`); }
  return out.sort((x, y) => y.pr - x.pr).map(x => x.t);
}

function buildReading(st) {
  const sc = scoreA(st);
  const seed = norm(st.name) + "|" + JSON.stringify(st.checks) + "|" + st.area + st.momento + "|" + norm(st.atadura).slice(0, 40);
  const name = st.name.trim();
  const area = AREAS.find(x => x.key === st.area) || AREAS[AREAS.length - 1];
  const mom = MOMENTOS.find(x => x.key === st.momento) || null;
  const sym = symbolFor(st, sc);
  const A = sc.dom ? ASURAS[sc.dom] : null;
  const P = PUNTOS[sc.punto];
  const ten = tensions(st, sc);
  const paras = [];

  if (st.atadura.trim()) {
    paras.push(greet(name, pickV([
      `la atadura concreta que hoy quieres cortar es esta: «${excerpt(st.atadura)}». Kali no corta en abstracto: cada uno de sus enemigos tuvo nombre, forma e historia. Nombrar tu atadura, como acabas de hacer, ya es el primer corte.`,
      `empiezo por tus propias palabras. Lo que hoy necesitas disolver es: «${excerpt(st.atadura)}». En el Devi Mahatmya, ningún asura cae sin ser primero reconocido. Eso es exactamente lo que estás haciendo aquí.`
    ], seed, "ap")));
  }
  const openTxt = A ? pickV(A.open, seed, "op") : "No has marcado ningún asura con fuerza. Puede ser un momento de calma real, o que lo que hoy te ronda todavía no tiene nombre.";
  paras.push(st.atadura.trim() ? openTxt : greet(name, openTxt));

  if (A) {
    const mirrors = [];
    (st.checks[sc.dom] || []).forEach((v, i) => { if (v) mirrors.push(pickV(A.mir[i], seed, "mir" + i)); });
    if (sc.second) {
      const A2 = ASURAS[sc.second];
      const i2 = st.checks[sc.second].findIndex(Boolean);
      mirrors.push(`También está presente ${A2.name}, ${lcFirst(A2.sub)}. ` + pickV(A2.mir[i2], seed, "mir2"));
      const key = [sc.dom, sc.second].sort((x, y) => ASURA_ORDER.indexOf(x) - ASURA_ORDER.indexOf(y)).join("+");
      if (PAIRS[key]) mirrors.push(PAIRS[key]);
    }
    paras.push(mirrors.join(" "));
    paras.push(`Lo que Kali viene a disolver aquí no eres tú: es ${A.destruye}.`);
  }

  let areaP = st.area === "otro" && st.otro.trim() ? `El área de tu vida donde quieres invocar la fuerza de Kali la has nombrado a tu manera: «${excerpt(st.otro, 80)}».` : `El área donde hoy quieres invocar la fuerza de Kali es: ${lcFirst(area.t)}.`;
  areaP += " " + pickV(area.f, seed, "af");
  paras.push(areaP);

  if (ten[0]) paras.push(ten[0]);

  if (st.liberacion.trim()) paras.push(pickV([
    `Si esta liberación se lograra, así ves tu vida en paz y sin el peso del ego: «${excerpt(st.liberacion)}». Guarda esa imagen: es hacia donde apunta el filo de Kali.`,
    `Describiste así tu vida una vez disuelto el ego: «${excerpt(st.liberacion)}». Esa es la calma a la que Kali regresa después de cada batalla.`
  ], seed, "vis"));

  if (mom) paras.push(pickV(mom.m, seed, "mm"));

  const sk = [];
  if (st.sankalpa.trim()) sk.push(pickV([`Tu propósito principal, tu Sankalpa, es: «${excerpt(st.sankalpa)}».`, `El propósito que defines hoy es: «${excerpt(st.sankalpa)}».`], seed, "sk"));
  if (st.porque.trim()) sk.push(`Y su raíz está en lo que escribiste después: «${lcFirst(excerpt(st.porque, 130))}». Vuelve a esa frase los días en que flaquees.`);
  if (st.accion.trim()) sk.push(pickV([`Tu acción firme y valiente, tu Vira, de hoy es: «${lcFirst(excerpt(st.accion, 110))}». Hazla hoy, aunque sea de forma pequeña.`, `«${ucFirst(excerpt(st.accion, 110))}» es la acción valiente que te propones. Que sea hoy, no «cuando pueda».`], seed, "acc"));
  const entregas = [];
  if (st.miedo.trim()) entregas.push(`un miedo («${excerpt(st.miedo, 70)}»)`);
  if (st.apego.trim()) entregas.push(`un apego («${excerpt(st.apego, 70)}»)`);
  if (entregas.length) sk.push(`Y lo que hoy entregas al fuego transformador de Kali es ${entregas.join(", ")}. Lo que se entrega al fuego ya no se carga igual.`);
  if (sk.length) paras.push(sk.join(" "));

  if (ten[1]) paras.push(ten[1]);

  const chosen = COMMITMENTS.filter((c, i) => st.compromisos[i]);
  const rec = A ? COMMITMENTS.find(c => c.key === ASURA_COMMIT[sc.dom]) : null;
  let cm;
  const recName = rec ? `«${rec.t.replace(/\.$/, "")}»` : "";
  if (!chosen.length) cm = rec ? `No has marcado todavía ninguna práctica de tu Sadhana. Si tuvieras que quedarte con una sola, que sea ${recName}, porque ${rec.why}.` : "No has marcado ninguna práctica. Empieza por una sola y cúmplela con sencillez.";
  else if (rec && chosen.some(c => c.key === rec.key)) cm = `Entre tus prácticas elegiste ${recName}, y es justo la que más te ayuda frente a ${A.name}: ${rec.why}.`;
  else if (rec) cm = `Frente a ${A.name}, la práctica que más te ayudaría es ${recName}, porque ${rec.why}. Si puedes, súmala a las que ya elegiste.`;
  else cm = `Has elegido ${chosen.length === 1 ? "una práctica" : chosen.length + " prácticas"} para tu Sadhana. Cúmplelas con sencillez.`;

  const fk = FEELINGS.filter(f => st.sentir.includes(f.key));
  const closeFeel = fk.length ? fk[0].close + (fk.length > 1 ? " Y no sientes solo eso: marcaste también " + fk.slice(1).map(f => lcFirst(f.t)).join(" y ") + "." : "") : "No has marcado cómo te sientes, y está bien. A veces lo que se mueve por dentro todavía no tiene nombre.";

  const practice = [];
  practice.push(pickV(["Cada mañana, antes de mirar el móvil, lee tu Sankalpa en voz baja.", "Al despertar, antes de levantarte, repite mentalmente tu propósito tres veces."], seed, "p1"));
  if (A) practice.push(pickV(A.daily, seed, "p2"));
  if (sc.second) practice.push(`Como también está presente ${ASURAS[sc.second].name}: ${lcFirst(pickV(ASURAS[sc.second].daily, seed, "p3"))}`);
  practice.push(sym.S.pr);

  const order = sc.order.filter(k => sc.s[k] > 0);
  const ritual = `Kali se honra especialmente en Amavasya, la noche de luna nueva. Cuando llegue la próxima, escribe en un papel el nombre de tu asura principal${order.length ? ` (hoy: ${order.map(k => ASURAS[k].name).join(", ")})` : ""}${(st.miedo.trim() || st.apego.trim()) ? `, y junto a él lo que hoy entregaste al fuego: ${entregas.length ? entregas.join(", ") : ""}` : ""}. Enciende una vela en un espacio a oscuras, quema o rompe el papel, y quédate un momento en ese silencio antes de volver a la luz. No hace falta esperar a que todo esté resuelto: hace falta marcar que la sombra ya ha sido nombrada.`;

  const decreto = st.frase.trim() ? excerpt(st.frase, 180) : A ? A.afirm : "Identifico la sombra, y en identificarla ya empiezo a soltarla.";

  return { sc, A, P, area, mom, sym, ten, paras: paras.filter(p => p && p.trim()), cm, closeFeel, practice, ritual, decreto, cierre: pickV(CIERRES, seed, "cierre"), seed };
}

<script>
const PACK_URL = "https://dharmaeterno-ec8pog.subscribepage.io/";
const CHECK = '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12l5 5L19 7" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function cap(name){try{if(window.claude&&typeof window.claude.use==="function")return window.claude.use(name).catch(()=>null);}catch(e){}return Promise.resolve(null);}
const capDownloads = cap("downloads");

const KEY = "kali_liberacion_v1";
const blank = () => ({ step:0, name:"", area:"", otro:"", atadura:"", liberacion:"", momento:"",

  presente:"", sankalpa:"", porque:"", accion:"", miedo:"", apego:"",
  compromisos:[false,false,false,false,false], sentir:[], frase:"" });
let S = blank();
try{const sv=JSON.parse(localStorage.getItem(KEY)||"null"); if(sv&&sv.checks) S=Object.assign(blank(),sv);}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const PH = ["I. Claridad y objetivos","II. Test de las fuerzas adversarias internas","III. Definición del propósito","IV. Mi compromiso de práctica","V. Reflexión y cierre"];

];

function phases(ph){
  let h='<div class="phases" aria-hidden="true">';
  for(let i=0;i<5;i++){ if(i) h+=`<span class="bar ${i<=ph?"on":""}"></span>`; h+=`<span class="pip ${i<ph?"on":i===ph?"cur":""}"></span>`; }
  return h+'</div>';
}
function foot(nextLabel){
  return `<div class="err" id="err" role="alert"></div><div class="foot">
    <button class="back" onclick="go(-1)">Atrás</button>
    <button class="btn main" onclick="go(1)">${nextLabel||"Continuar"}</button></div>`;
}
function radio(list,key){
  return `<div class="opts" role="radiogroup">${list.map(o=>`<button class="opt round ${S[key]===o.key?"sel":""}" role="radio" aria-checked="${S[key]===o.key}" onclick="setv('${key}','${o.key}')"><span class="box">${CHECK}</span><span>${o.d?`<b>${o.t}</b><small>${o.d}</small>`:o.t}</span></button>`).join("")}</div>`;
}
function field(key,ph,rows){ return `<textarea id="f-${key}" rows="${rows||4}" placeholder="${ph||""}" oninput="S.${key}=this.value;persist()">${esc(S[key])}</textarea>`; }
const divider = () => `<img class="art" style="max-width:220px;margin:6px auto 14px" src="${IMG.om}" alt="">`;

function view(id){

}

function render(scroll=true){
  const st = STEPS[S.step]||STEPS[0];
  const app = document.getElementById("app");
  const top = st.ph>=0 && st.ph<5 ? phases(st.ph) : "";
  app.innerHTML = top + (st.id==="resultado" ? viewResult() : view(st.id));
  if(scroll) window.scrollTo({top:0,behavior:"instant"});
}
function validate(){
  const id=STEPS[S.step].id;
  if(id==="nombre"&&!S.name.trim()) return "Escribe tu nombre para continuar.";
  if(id==="area"&&!S.area) return "Elige un área para continuar.";
  if(id==="area"&&S.area==="otro"&&!S.otro.trim()) return "Escribe cuál es el área.";
  if(id==="atadura"&&!S.atadura.trim()) return "Escribe tu atadura para continuar.";
  if(id==="presente"&&!S.presente) return "Elige una opción para continuar.";
  if(id==="momento"&&!S.momento) return "Elige el momento en que te reconoces.";
  if(id==="proposito1"&&!S.sankalpa.trim()) return "Escribe tu propósito para continuar.";
  return "";
}
function go(d){
  if(d>0){ const e=validate(); if(e){ const el=document.getElementById("err"); if(el) el.textContent=e; return; } }
  S.step=Math.max(0,Math.min(STEPS.length-1,S.step+d)); persist(); render();
}
function setv(k,v){ S[k]=v; persist(); render(false); }
function tog(k,i){ S.checks[k][i]=!S.checks[k][i]; persist(); render(false); }
function togc(i){ S.compromisos[i]=!S.compromisos[i]; persist(); render(false); }
function togf(k){ const i=S.sentir.indexOf(k); if(i>=0) S.sentir.splice(i,1); else S.sentir.push(k); persist(); render(false); }
function restart(){ S=blank(); persist(); render(); }
function toast(t,ms=3600){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),ms); }

function plainText(){
  const A=R.A, sc=R.sc;
  let t=`TEST DE KALI · LIBERACIÓN, TRANSFORMACIÓN Y PODER INTERIOR\nLectura de ${S.name.trim()}\n\nTu momento de transformación: ${R.P.name}\n${R.P.text}\n\n`;
  if(S.atadura.trim()) t+=`TU ATADURA DE HOY\n«${S.atadura.trim()}»\n`+(S.liberacion.trim()?`Tu vida en paz: ${S.liberacion.trim()}\n`:"")+"\n";
  t+=R.paras.join("\n\n")+"\n\n";
  t+="TUS CINCO ASURAS\n"+ASURA_ORDER.map(k=>`${ASURAS[k].name} (${lcFirst(ASURAS[k].sub)}): ${sc.s[k]}/2`).join("\n")+"\n\n";
  if(A) t+=`EL MITO DE ${A.name.toUpperCase()}\n${A.mito}\n${A.ense}\n\n`;
  if(R.mom) t+=`EL MOMENTO DE TU CAMINO: ${R.mom.name.toUpperCase()}\n${R.mom.relato}\n\n`;
  t+=`EL SÍMBOLO QUE TE HABLA: ${R.sym.S.name}\n${R.sym.S.sig}\n${R.sym.S.msg}\n\n`;
  t+=`DEFINICIÓN DE MI PROPÓSITO\nMi Sankalpa: ${S.sankalpa}\n`+(S.porque?`Por qué es vital para mi alma: ${S.porque}\n`:"")+(S.accion?`Mi acción firme y valiente: ${S.accion}\n`:"")+(S.miedo?`Un miedo entregado: ${S.miedo}\n`:"")+(S.apego?`Un apego entregado: ${S.apego}\n`:"")+"\n";
  t+=`MI SADHANA\n${R.cm}\n`+R.practice.map((p,i)=>`${i+1}. ${p}`).join("\n")+"\n\n";
  t+=`TU RITUAL DE AMAVASYA\n${R.ritual}\n\n«${R.decreto}»\n\n${R.closeFeel}\n${R.cierre}\n¡Jai Maa Kali!\n\ndharmaeterno.com`;
  return t;
}
async function copyText(){
  const t=plainText();
  try{ await navigator.clipboard.writeText(t); toast("Lectura copiada. Pégala en Notas o en un email."); return; }catch(e){}
  const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("Lectura copiada. Pégala en Notas o en un email."); }catch(e){ toast("No se pudo copiar en este navegador."); }
  ta.remove();
}
const clean=s=>String(s).replace(/[""]/g,'"').replace(/['']/g,"'").replace(/[—–]/g,"-").replace(/…/g,"...");
function makePDF(){
  const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"mm",format:"a4"});
  const W=210,H=297,M=22,TW=W-2*M; let y;
  const page=()=>{ doc.setFillColor(246,240,227); doc.rect(0,0,W,H,"F"); doc.setDrawColor(156,122,46); doc.setLineWidth(.6); doc.rect(9,9,W-18,H-18); doc.setLineWidth(.2); doc.rect(11.5,11.5,W-23,H-23); y=M+2; };
  const need=h=>{ if(y+h>H-M){ doc.addPage(); page(); } };
  const txt=(s,size,style,rgb,o={})=>{ doc.setFont("times",style); doc.setFontSize(size); doc.setTextColor(...rgb);
    const lines=doc.splitTextToSize(clean(s),o.w||TW); const lh=size*.5; lines.forEach(l=>{ need(lh); o.center?doc.text(l,W/2,y,{align:"center"}):doc.text(l,o.x||M,y); y+=lh; }); };
  const maroon=[92,14,23], ink=[33,24,35], gold=[156,122,46];
  const head=s=>{ need(20); y+=4; txt(s,15,"bold",maroon); doc.setDrawColor(122,20,32); doc.setLineWidth(.5); doc.line(M,y-2.5,M+28,y-2.5); y+=3; };
  const img=(src,w,h)=>{ need(h+4); try{ doc.addImage(src,"WEBP",W/2-w/2,y,w,h); y+=h+4; }catch(e){} };
  page();
  img(IMG.yantra,40,40);
  txt("Test de Kali",22,"normal",maroon,{center:true}); y+=1;
  txt(`Liberación, transformación y poder interior · Lectura de ${S.name.trim()}`,12,"italic",gold,{center:true}); y+=5;
  txt("Tu momento de transformación",12,"italic",ink,{center:true});
  txt(R.P.name,20,"bold",maroon,{center:true}); y+=2;
  txt(R.P.text,12,"normal",ink);
  if(S.atadura.trim()){ head("Tu atadura de hoy"); txt(`"${S.atadura.trim()}"`,12,"italic",ink); if(S.liberacion.trim()){ y+=2; txt("Tu vida en paz: "+S.liberacion.trim(),12,"normal",ink);} }
  head("Tu lectura"); R.paras.forEach(p=>{ txt(p,12,"normal",ink); y+=2.5; });
  head("Tus cinco asuras");
  ASURA_ORDER.forEach(k=>{ need(8); doc.setFont("times",R.sc.dom===k?"bold":"normal"); doc.setFontSize(11); doc.setTextColor(...ink); doc.text(`${ASURAS[k].name} (${lcFirst(ASURAS[k].sub)})`,M,y);
    for(let i=0;i<2;i++){ const cx=M+128+i*8; doc.setDrawColor(74,42,32); doc.setLineWidth(.5); if(i<R.sc.s[k]){ doc.setFillColor(92,14,23); doc.circle(cx,y-1.4,2,"FD"); } else doc.circle(cx,y-1.4,2,"S"); } y+=7.5; });
  if(R.A){ head(`El mito de ${R.A.name}`); txt(R.A.mito,12,"italic",ink); y+=2; txt(R.A.ense,12,"normal",ink); }
  if(R.mom){ head(`El momento de tu camino: ${R.mom.name}`); txt(R.mom.relato,12,"italic",ink); }
  head(`El símbolo que te habla: ${R.sym.S.name}`); txt(R.sym.S.sig,12,"italic",ink); y+=2; txt(R.sym.S.msg,12,"normal",ink);
  head("Definición de mi propósito");
  [["Mi Sankalpa",S.sankalpa],["Por qué es vital para mi alma",S.porque],["Mi acción firme y valiente (Vira)",S.accion],["Un miedo que entrego",S.miedo],["Un apego que entrego",S.apego]].filter(r=>r[1]&&r[1].trim()).forEach(([a,b])=>{ txt(a,11,"bold",gold); txt(b,12,"normal",ink); y+=2.5; });
  head("Mi Sadhana"); txt(R.cm,12,"normal",ink); y+=2;
  COMMITMENTS.filter((c,i)=>S.compromisos[i]).forEach(c=>{ txt("- "+c.t,12,"normal",ink); y+=1; });
  y+=2; R.practice.forEach((p,i)=>{ need(8); doc.setFont("times","bold"); doc.setFontSize(12); doc.setTextColor(...gold); doc.text(`${i+1}.`,M,y); txt(p,12,"normal",ink,{x:M+7,w:TW-7}); y+=2; });
  head("Tu ritual de Amavasya"); txt(R.ritual,12,"normal",ink);
  need(40); y+=8; txt(`"${R.decreto}"`,16,"italic",maroon,{center:true}); y+=1; txt("La cualidad que quieres recordar",10,"normal",gold,{center:true}); y+=5;
  txt(R.closeFeel,12,"normal",ink,{center:true}); y+=2; txt(R.cierre,12,"italic",ink,{center:true}); y+=3;
  txt("Jai Maa Kali",18,"bold",maroon,{center:true}); y+=6;
  img(IMG.logo,50,16);
  return doc.output("blob");
}
function slug(s){ return (s||"lectura").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"lectura"; }
async function downloadPDF(){
  if(!window.jspdf){ toast("El PDF no está disponible sin conexión. Usa «Copiar lectura».."); return; }
  let blob; try{ blob=makePDF(); }catch(e){ toast("No se pudo generar el PDF. Usa «Copiar lectura»."); return; }
  const filename=`liberacion-kali-${slug(S.name)}.pdf`;
  const dl=await capDownloads;
  if(dl){ try{ await dl.save({filename,data:blob}); toast(`Guardado como «${filename}».`); }catch(e){ toast(e&&e.code==="declined"?"Descarga cancelada.":"No se pudo guardar aquí. Usa «Copiar lectura»."); } return; }
  try{ const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),10000); toast(`Descargando «${filename}».`); }
  catch(e){ toast("No se pudo descargar aquí. Usa «Copiar lectura»."); }
}
render(false);
</script>
